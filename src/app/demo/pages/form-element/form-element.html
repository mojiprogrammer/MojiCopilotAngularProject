<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="DeepSeek AI" [options]="false">

      <h5 class="mt-5 text-center">Start chatting with DeepSeek</h5>
      <hr />
      <form class="was-validated">
        <div class="mb-3">
          <!-- <label for="validationTextarea" class="form-label">Message DeepSeek</label> -->
          <textarea class="form-control" id="validationTextarea" placeholder="Message DeepSeek" required></textarea>
          <div class="invalid-feedback">Please enter a message in the text.</div>
        </div>

        <div class="mb-3">
          <button class="btn btn-primary" type="submit">Ask</button>
        </div>
      </form>

    </app-card>
  </div>

</div>
